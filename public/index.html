<!doctype html>
<html lang="en">
  <head>
    <title>todolist</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
  </head>
  <body>
      <div id="app" >
          <div id="header" class="d-flex justify-content-center">
            <p class="d-flex"> todo-list </p>
            <!-- <i class="fa fa-tasks p-2" aria-hidden="true"></i> -->
          </div>
          <div class="form-group d-flex tasks">
            <input class="form-control form-control-sm inputText" type="text" name="task" >
            <a href="#"><i class="fa fa-edit p-1" aria-hidden="true"></i></a>
            <a href="#"><i class="fa fa-save p-1" aria-hidden="true"></i></a>
            <a href="#"><i class="fa fa-trash p-1" aria-hidden="true"></i></a>
          </div>
        </div>
      
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="bundle.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
